name: Daily Ghent News Agent

on:
  schedule:
    - cron: '0 6 * * *' # 每天早上 6:00 UTC 執行
  workflow_dispatch:      # 允許手動按鈕觸發

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 🔥 關鍵步驟：把 GitHub Secret 還原成 JSON 檔案 🔥
      - name: Create JSON key file
        run: |
          echo '${{ secrets.G_SHEET_JSON }}' > googlesheetapi.json

      - name: Run News Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MODEL_NAME: models/gemma-4-26b-a4b-it
        run: |
          python daily_news_agent.py

  # GitHub 會停用 60 天沒有活動的 public repo 排程，這裡用 API 重設計時
  # 獨立 job：新聞抓取失敗時也會執行
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily_news.yml/enable"
